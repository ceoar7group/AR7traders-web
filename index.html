<script>
(function(){
  try{
    var car=null;
    var m=String(location.pathname||'').match(/^\/inventory\/([^/?#]+)/);
    if(m) car=decodeURIComponent(m[1]);
    if(!car){
      var raw=String(location.hash||'').replace(/^#/,'');
      try{raw=decodeURIComponent(raw);}catch(e){}
      try{raw=decodeURIComponent(raw);}catch(e){}
      var q=raw.indexOf('?')>=0?raw.split('?')[1]:'';
      var parts=raw.split('?')[0].replace(/^\/+/,'').split('/').filter(Boolean);
      if(parts[0]==='inventory'&&parts[1]) car=parts[1];
      if(!car&&q){
        var params=new URLSearchParams(q);
        car=params.get('car')||params.get('id');
      }
    }
    if(car) sessionStorage.setItem('ar7-open-vehicle',car);
  }catch(e){}
})();
</script>
