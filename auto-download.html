<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AR7 Traders — downloading…</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #063f29; color: #eef4ef; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; margin: 0; }
  .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: 22px; padding: 36px; max-width: 560px; text-align: center; backdrop-filter: blur(8px); }
  h1 { font-size: 24px; margin: 0 0 12px; }
  h1 span { color: #e5b553; }
  p { color: #c8dcd2; line-height: 1.6; margin: 8px 0; font-size: 14.5px; }
  .button { display: inline-block; background: linear-gradient(135deg, #e5b553, #c9942f); color: #0a2b1d; font-weight: 800; font-size: 17px; padding: 14px 32px; border-radius: 12px; text-decoration: none; border: 0; cursor: pointer; margin-top: 18px; box-shadow: 0 8px 22px rgba(229,181,83,.35); }
  .progress { width: 100%; height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; margin: 16px 0; }
  .bar { height: 100%; background: #e5b553; width: 0; transition: width .3s; }
  .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid #e5b553; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  .small { font-size: 12px; color: #8fb8a4; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>⬇ Downloading <span>AR7 Traders</span></h1>
  <p id="status"><span class="loader"></span>Fetching 21.9 MB file…</p>
  <div class="progress hidden" id="progwrap"><div class="bar" id="bar"></div></div>
  <a id="dlbtn" class="button hidden">⬇ Click to download (21.9 MB)</a>
  <p class="small" id="cta">If the download doesn't start in a few seconds, click the button above.</p>
</div>

<script>
const URL = 'https://raw.githubusercontent.com/ceoar7group/AR7traders-web/refs/heads/downloads/AR7-Traders-ALL-IN-ONE.html';
const NAME = 'AR7-Traders-ALL-IN-ONE.html';

async function download() {
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  const wrap = document.getElementById('progwrap');
  const btn = document.getElementById('dlbtn');

  try {
    status.innerHTML = '<span class="loader"></span>Fetching 21.9 MB file from GitHub…';
    wrap.classList.remove('hidden');

    const res = await fetch(URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const total = +res.headers.get('content-length') || 22900000;
    const reader = res.body.getReader();
    const chunks = []; let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length;
      bar.style.width = Math.round(received / total * 100) + '%';
      status.innerHTML = '<span class="loader"></span>Downloaded ' + (received/1e6).toFixed(1) + ' / ' + (total/1e6).toFixed(1) + ' MB';
    }

    const blob = new Blob(chunks, { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = NAME;
    a.click();
    URL.revokeObjectURL(a.href);

    status.innerHTML = '✓ Download started! Look in your Downloads folder for <b>' + NAME + '</b>';
    btn.classList.add('hidden');
  } catch (e) {
    status.innerHTML = '✗ Auto-fetch failed: ' + e.message + '<br>Click below to download manually.';
    btn.href = URL;
    btn.download = NAME;
    btn.classList.remove('hidden');
  }
}

// Try once on load, then again after a short delay (some browsers block
// automatic downloads, so a button is always provided as a fallback).
window.addEventListener('load', () => setTimeout(download, 500));
</script>
</body>
</html>
