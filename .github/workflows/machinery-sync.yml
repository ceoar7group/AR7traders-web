name: Machinery importer

# Re-reads every machine that came from a supplier link: records any price
# change (old → new, never just the new figure) and FLAGS the ones the supplier
# has taken down. It never deletes a machine and never adds one on its own —
# a machine only enters the database when a person previews a link and presses
# Import in the CRM.
#
# Offset from the Goo-net run (03:00) so the two never compete for the same
# Vercel function budget, and set well after it so a slow car run cannot
# overlap. Same pattern as goonet-sync.yml: a free GitHub Actions schedule
# calling one small Vercel function, so no Vercel cron add-on is needed.
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit stored/hidden imports (read only), or refresh supplier listings'
        type: choice
        options: [audit, refresh, recover]
        default: audit
      confirm_recovery:
        description: 'Confirm publication of valid Available hidden imports (not archived/sold/reserved)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trigger machinery sync on Vercel
        env:
          SYNC_URL: ${{ secrets.GOONET_SYNC_URL }}
          SYNC_KEY: ${{ secrets.GOONET_SYNC_KEY }}
          MODE: ${{ inputs.mode || 'refresh' }}
          CONFIRM_RECOVERY: ${{ inputs.confirm_recovery || 'false' }}
        run: |
          if [ -z "$SYNC_KEY" ]; then
            echo "::error::GOONET_SYNC_KEY secret is not set. Add it in GitHub → Settings → Secrets, matching the GOONET_SYNC_KEY env var in Vercel."
            exit 1
          fi
          # Old deployments ignore unknown job names. Verify support before
          # sending an audit or recovery request; never accidentally run a car sync.
          curl --fail -sSL -m 20 "${SYNC_URL:-https://ar7traders.com}/api/site-content?capabilities=machinery" -o /tmp/machinery-capabilities.json
          node -e "const c=require('/tmp/machinery-capabilities.json'); if(c.version!==2 || !c.audit || !c.recoverImports) process.exit(1)"
          JOB=machinery
          if [ "$MODE" = "audit" ]; then JOB=machinery-audit; fi
          CURL_ARGS=()
          if [ "$MODE" = "recover" ]; then
            if [ "$CONFIRM_RECOVERY" != "true" ]; then echo "::error::Recovery confirmation is required"; exit 1; fi
            JOB=machinery-recover
            CURL_ARGS=(-X POST -H 'Content-Type: application/json' --data '{"confirm":true}')
          fi
          URL="${SYNC_URL:-https://ar7traders.com}/api/goonet-sync?key=${SYNC_KEY}&job=${JOB}"
          # -L follows the site's canonical-domain redirect (www.ar7traders.com → ar7traders.com;
          # the apex is canonical — all canonical/og:url/sitemap URLs use https://ar7traders.com)
          CODE=$(curl -sSL -m 75 "${CURL_ARGS[@]}" -o /tmp/machinery-sync.json -w "%{http_code}" "$URL")
          echo "HTTP status: $CODE"
          echo "Response:"
          cat /tmp/machinery-sync.json
          echo
          if [ "$CODE" != "200" ]; then
            node scripts/check-sync-report.mjs /tmp/machinery-sync.json || true
            echo "::error::Machinery importer returned HTTP $CODE — see the diagnostic above"
            exit 1
          fi
          node scripts/check-sync-report.mjs /tmp/machinery-sync.json
