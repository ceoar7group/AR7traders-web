name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push for the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # CI covers the documented Node 22 baseline and Vercel's Node 24 runtime.
    strategy:
      matrix:
        node: ['22', '24']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test suites
        run: npm test

      - name: Build website
        run: npm run build

      - name: Build CRM preview
        run: npm run build:crm
