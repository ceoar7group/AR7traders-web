name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push for the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines asks for >= 20.19.0
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test suites
        run: npm test

      - name: Build website
        run: npm run build

      - name: Build CRM preview
        run: npm run build:crm
