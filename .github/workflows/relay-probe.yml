# A diagnostic probe, dispatched by hand, that measures what this repo's
# scraper can only guess at from inside Vercel: what goo-net and the Jina
# relay ACTUALLY answer, from a network we can read the logs of. Each probe
# prints status / size / seconds, the first bytes of the body, and how many
# /usedcar/spread/ links (real car cards) the answer carries.
#
# Add the repo secret JINA_API_KEY to unlock the keyed-tier probes (proxy
# pool); without it the relay probes run on the keyless tier.
name: relay-probe
on:
  workflow_dispatch: {}
  # workflow_dispatch only registers once the file reaches the default
  # branch; the push trigger lets the probe run from a working branch too.
  push:
    paths:
      - '.github/workflows/relay-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe goo-net and the relay
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          exec > >(tee probe-results.txt) 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          BASE="https://www.goo-net-exchange.com"
          fetchx () { # url outfile
            curl -sS --compressed -L -m 30 -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -o "$2" -w 'answer: %{http_code} %{size_download}B %{time_total}s %{url_effective}\n' "$1"
          }
          cards () { # file — print the card ids and JPY prices this page carries
            grep -oE 'href="/usedcars/[A-Z0-9_]+/[A-Z0-9_]+/[0-9]+/"' "$1" | grep -oE '[0-9]{15,}' | sort -u > /tmp/ids.txt
            echo "cards: $(wc -l < /tmp/ids.txt)"
            echo "ids: $(head -c 400 /tmp/ids.txt | tr '\n' ' ')"
            echo "jpy prices: $(grep -oE 'class="price currency-jpy">\xc2\xa5[0-9,]+' "$1" | grep -oE '[0-9,]+$' | head -20 | tr '\n' ' ')"
          }
          echo "== page 1 (year_min=2018) =="
          fetchx "$BASE/php/search/summary.php?year_min=2018&search_type=year_search" page1.html
          cards page1.html
          echo "== page 2 via GET offset=20 =="
          fetchx "$BASE/php/search/summary.php?year_min=2018&search_type=year_search&offset=20" page2.html
          cards page2.html
          echo "== page 2 via GET offset=20&page=2 =="
          fetchx "$BASE/php/search/summary.php?year_min=2018&search_type=year_search&offset=20&page=2" page2b.html
          cards page2b.html
          echo "== price filter GET, JPY 1,000,000-3,000,000 =="
          fetchx "$BASE/php/search/summary.php?price1=1000000&price2=3000000&radio_currency=JPY&search_type=price_search" price-jpy.html
          cards price-jpy.html
          echo "== price filter GET, plain price1/price2 =="
          fetchx "$BASE/php/search/summary.php?price1=1000000&price2=3000000&search_type=price_search" price-plain.html
          cards price-plain.html
          echo "== bogus detail url (what does a dead listing answer?) =="
          fetchx "$BASE/usedcars/TOYOTA/RAIZE/700000000000000000001/" dead.html
            echo "dead body head:"; head -c 400 dead.html | tr -d '\0'; echo
      # The sandbox driving this session cannot download Actions logs (they
      # live on a blob host outside its egress allowlist), so the results are
      # committed to the branch where a plain `git fetch` can read them.
      - name: Commit the results to the branch
        if: always()
        run: |
          git config user.name "relay-probe"
          git config user.email "relay-probe@users.noreply.github.com"
          git add probe-results.txt
          git commit -m "relay-probe: results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
