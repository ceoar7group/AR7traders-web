# Relay probe: GitHub runners can reach the photo CDN while the sandbox
# cannot. Round S6 (2026-11-07): fetch EVERY gallery frame of the 18 showroom
# cars as small thumbnails (competitor-ad audit), plus two full-resolution
# second-angle frames (cars 14 and 16) that were missed last round. Restored
# to the main version before the PR is merged.
name: relay-probe
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/relay-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/ba126671-ar7traders-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: fetch frames
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          node --input-type=module > /tmp/all.txt <<'EOF'
          import { readFileSync } from 'fs';
          const seed = JSON.parse(readFileSync('src/site-content.seed.json', 'utf8'));
          for (const car of seed.listings.filter(x => x.id >= 1 && x.id <= 18)) {
            car.images.forEach((u, i) => {
              console.log(String(car.id).padStart(2, '0') + ' ' + String(i).padStart(2, '0') + ' ' + u);
            });
          }
          EOF
          node --input-type=module > /tmp/full.txt <<'EOF'
          import { readFileSync } from 'fs';
          const seed = JSON.parse(readFileSync('src/site-content.seed.json', 'utf8'));
          const picks = { 2:0, 14:5, 16:6 };
          for (const car of seed.listings.filter(x => picks[x.id] !== undefined)) {
            console.log(String(car.id).padStart(2, '0') + ' ' + car.images[picks[car.id]]);
          }
          EOF
          mkdir -p probe-shots/angle-src /tmp/all
          while read -r id url; do
            curl -sS -m 40 -A "$UA" -o "probe-shots/angle-src/$id.jpg" "$url" || true
          done < /tmp/full.txt
          while read -r id idx url; do
            mkdir -p "/tmp/all/$id"
            curl -sS -m 40 -A "$UA" -o "/tmp/all/$id/$idx.jpg" "$url" || true
          done < /tmp/all.txt
          npm install --no-save sharp > /dev/null 2>&1
          node --input-type=module <<'EOF2'
          import { readdirSync, mkdirSync } from 'fs';
          import sharp from 'sharp';
          mkdirSync('probe-shots/allframes', { recursive: true });
          for (const id of readdirSync('/tmp/all')) {
            for (const f of readdirSync('/tmp/all/' + id)) {
              try {
                await sharp('/tmp/all/' + id + '/' + f).resize({ width: 200 }).jpeg({ quality: 60 }).toFile('probe-shots/allframes/' + id + '-' + f);
              } catch { /* skip broken download */ }
            }
          }
          EOF2
          du -sh probe-shots
      - name: commit results
        run: |
          git config user.name 'relay-probe'
          git config user.email 'actions@github.com'
          git add probe-shots
          git commit -m "relay-probe: S6 full gallery audit" || echo nothing
          git push
