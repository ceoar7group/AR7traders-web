# A diagnostic probe, dispatched by hand, that measures what this repo's
# scraper can only guess at from inside Vercel: what goo-net and the Jina
# relay ACTUALLY answer, from a network we can read the logs of. Each probe
# prints status / size / seconds, the first bytes of the body, and how many
# /usedcar/spread/ links (real car cards) the answer carries.
#
# Add the repo secret JINA_API_KEY to unlock the keyed-tier probes (proxy
# pool); without it the relay probes run on the keyless tier.
name: relay-probe
on:
  workflow_dispatch: {}
  # workflow_dispatch only registers once the file reaches the default
  # branch; the push trigger lets the probe run from a working branch too.
  push:
    paths:
      - '.github/workflows/relay-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe goo-net and the relay
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          exec > >(tee probe-results.txt) 2>&1
          URL="https://www.goo-net.com/usedcar/price-100-300/"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          probe () {
            name="$1"; shift
            echo "===================================================="
            echo "== $name"
            body=$(mktemp)
            meta=$(curl -sS --compressed -m 30 -o "$body" -w '%{http_code} %{size_download}B %{time_total}s' "$@" 2>&1) || { echo "curl failed: $meta"; rm -f "$body"; return 0; }
            echo "answer: $meta"
            echo "spread links: $(grep -o '/usedcar/spread/' "$body" | wc -l)"
            echo "body head:"
            head -c 500 "$body" | tr -d '\0'; echo
            rm -f "$body"
          }
          probe "goo-net DIRECT from this runner" -A "$UA" -H "Accept-Language: ja,en;q=0.8" "$URL"
          # goo-net's ENGLISH export portal — built for overseas buyers, so it
          # may not carry the domestic site's datacenter-IP blockade at all.
          XURL="https://www.goo-net-exchange.com/usedcars/"
          probe "goo-net-EXCHANGE direct (search page)" -L -A "$UA" -H "Accept-Language: en-US,en;q=0.9" "$XURL"
          probe "goo-net-EXCHANGE direct (top page)"    -L -A "$UA" -H "Accept-Language: en-US,en;q=0.9" "https://www.goo-net-exchange.com/"
          probe "goo-net-EXCHANGE via relay, curl engine" -H "X-Return-Format: html" -H "X-Engine: curl" "https://r.jina.ai/$XURL"
          if [ -n "$JINA_API_KEY" ]; then
            echo "(JINA_API_KEY secret present: keyed probes enabled)"
            AUTH="Authorization: Bearer $JINA_API_KEY"
          else
            echo "(no JINA_API_KEY secret: keyless relay tier, no proxy probes)"
            AUTH="X-Probe: keyless"
          fi
          probe "relay, default engine"            -H "$AUTH" -H "X-Return-Format: html" "https://r.jina.ai/$URL"
          probe "relay, curl engine"               -H "$AUTH" -H "X-Return-Format: html" -H "X-Engine: curl" "https://r.jina.ai/$URL"
          probe "relay, browser engine"            -H "$AUTH" -H "X-Return-Format: html" -H "X-Engine: browser" "https://r.jina.ai/$URL"
          if [ -n "$JINA_API_KEY" ]; then
            probe "relay, curl + proxy auto"       -H "$AUTH" -H "X-Return-Format: html" -H "X-Engine: curl" -H "X-Proxy: auto" "https://r.jina.ai/$URL"
            probe "relay, browser + proxy auto"    -H "$AUTH" -H "X-Return-Format: html" -H "X-Engine: browser" -H "X-Proxy: auto" "https://r.jina.ai/$URL"
            probe "relay, curl + proxy jp"         -H "$AUTH" -H "X-Return-Format: html" -H "X-Engine: curl" -H "X-Proxy: jp" "https://r.jina.ai/$URL"
            probe "relay, browser + proxy jp"      -H "$AUTH" -H "X-Return-Format: html" -H "X-Engine: browser" -H "X-Proxy: jp" "https://r.jina.ai/$URL"
            # Exactly what production sends after PR #92: the full tuned
            # header set from relayRequestHeaders() with the jp pin.
            probe "relay, PRODUCTION headers (curl + jp + cache-tolerance + html-timing)" \
              -A "$UA" -H "$AUTH" -H "X-Return-Format: html" -H "X-Engine: curl" -H "X-Proxy: jp" \
              -H "Accept-Language: ja,en-US;q=0.9,en;q=0.8" -H "X-Cache-Tolerance: 900" \
              -H "X-Respond-Timing: html" -H "X-With-Links-Summary: false" "https://r.jina.ai/$URL"
          fi
      # The sandbox driving this session cannot download Actions logs (they
      # live on a blob host outside its egress allowlist), so the results are
      # committed to the branch where a plain `git fetch` can read them.
      - name: Commit the results to the branch
        if: always()
        run: |
          git config user.name "relay-probe"
          git config user.email "relay-probe@users.noreply.github.com"
          git add probe-results.txt
          git commit -m "relay-probe: results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
