# Relay probe: GitHub runners can reach the photo CDN while the sandbox
# cannot. Round S5 (2026-11-06): fetch the remaining four chosen
# second-angle frames (cars 05, 10, 13, 15) at full resolution. Restored to the main
# version before the PR is merged.
name: relay-probe
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/relay-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/f6184ee1-ar7traders-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: fetch frames
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          node --input-type=module > /tmp/full.txt <<'EOF'
          import { readFileSync } from 'fs';
          const seed = JSON.parse(readFileSync('src/site-content.seed.json', 'utf8'));
          const picks = { 5:23, 10:16, 13:27, 15:16 };
          for (const car of seed.listings.filter(x => picks[x.id])) {
            console.log(String(car.id).padStart(2, '0') + ' ' + car.images[picks[car.id]]);
          }
          EOF
          node --input-type=module > /tmp/deep.txt <<'EOF'
          import { readFileSync } from 'fs';
          const seed = JSON.parse(readFileSync('src/site-content.seed.json', 'utf8'));
          const ranges = {};
          for (const car of seed.listings.filter(x => ranges[x.id])) {
            const [a, b] = ranges[car.id];
            for (let i = a; i < Math.min(b, car.images.length); i++) {
              console.log(String(car.id).padStart(2, '0') + ' ' + i + ' ' + car.images[i]);
            }
          }
          EOF
          mkdir -p probe-shots/angle-src /tmp/deep
          while read -r id url; do
            curl -sS -m 40 -A "$UA" -o "probe-shots/angle-src/$id.jpg" "$url" || true
          done < /tmp/full.txt
          while read -r id idx url; do
            mkdir -p "/tmp/deep/$id"
            curl -sS -m 40 -A "$UA" -o "/tmp/deep/$id/$idx.jpg" "$url" || true
          done < /tmp/deep.txt
          npm install --no-save sharp > /dev/null 2>&1
          node --input-type=module <<'EOF2'
          import { readdirSync, mkdirSync } from 'fs';
          import sharp from 'sharp';
          mkdirSync('probe-shots/thumbs3', { recursive: true });
          for (const id of readdirSync('/tmp/deep')) {
            for (const f of readdirSync('/tmp/deep/' + id)) {
              try {
                await sharp('/tmp/deep/' + id + '/' + f).resize({ width: 240 }).jpeg({ quality: 65 }).toFile('probe-shots/thumbs3/' + id + '-' + f.padStart(6, '0'));
              } catch { /* skip broken download */ }
            }
          }
          EOF2
          du -sh probe-shots
      - name: commit results
        run: |
          git config user.name 'relay-probe'
          git config user.email 'actions@github.com'
          git add probe-shots
          git commit -m "relay-probe: S5 angle frames" || echo nothing
          git push
