# Relay probe: GitHub runners can reach the photo CDN while the sandbox
# cannot. Round S3 (2026-11-06): fetch thumbnails of gallery frames 1-8 for
# each of the 18 showroom cars (frame 0 is the cover) so a second exterior
# angle can be chosen per car, plus the chosen frames at full resolution in a
# later round. Restored to the main version before the PR is merged.
name: relay-probe
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/relay-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/f6184ee1-ar7traders-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: fetch candidate frames
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          node --input-type=module > /tmp/dl.txt <<'EOF'
          import { readFileSync } from 'fs';
          const seed = JSON.parse(readFileSync('src/site-content.seed.json', 'utf8'));
          for (const car of seed.listings.filter(x => Number(x.id) <= 18)) {
            car.images.slice(1, 9).forEach((u, i) => {
              console.log(String(car.id).padStart(2, '0') + ' ' + (i + 1) + ' ' + u);
            });
          }
          EOF
          mkdir -p /tmp/cars
          while read -r id idx url; do
            mkdir -p "/tmp/cars/$id"
            curl -sS -m 40 -A "$UA" -o "/tmp/cars/$id/$idx.jpg" "$url" || true
          done < /tmp/dl.txt
          npm install --no-save sharp > /dev/null 2>&1
          node --input-type=module <<'EOF2'
          import { readdirSync, mkdirSync } from 'fs';
          import sharp from 'sharp';
          mkdirSync('probe-shots/thumbs2', { recursive: true });
          for (const id of readdirSync('/tmp/cars')) {
            for (const f of readdirSync('/tmp/cars/' + id)) {
              try {
                await sharp('/tmp/cars/' + id + '/' + f).resize({ width: 240 }).jpeg({ quality: 65 }).toFile('probe-shots/thumbs2/' + id + '-' + f);
              } catch { /* skip broken download */ }
            }
          }
          EOF2
          du -sh probe-shots
      - name: commit results
        run: |
          git config user.name 'relay-probe'
          git config user.email 'actions@github.com'
          git add probe-shots
          git commit -m "relay-probe: S3 candidate frames" || echo nothing
          git push
