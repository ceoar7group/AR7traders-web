# Temporary probe: GitHub runners can reach the exchange while the sandbox
# cannot. Mission 2026-11-05 (round L1): discover the premium/luxury stock
# currently listed, to replace the showroom with REAL hyper & luxury cars.
# This file is removed again before the PR is merged.
name: relay-probe
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/relay-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/2607080c-ar7traders-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          BASE='https://www.goo-net-exchange.com'
          : > probe-results.txt
          fetchx () {
            ans=$(curl -sS -m 120 -A "$UA" -w '%{http_code} %{size_download}B %{time_total}s' -o "$2" "$1" 2>/dev/null) || ans='000 0B curl-failed'
            echo "answer: $ans $1" | tee -a probe-results.txt
          }
          f () { fetchx "$1" "$2" || echo "FAILED: $1" | tee -a probe-results.txt; sleep 2; }
          echo "== round L1: luxury discovery ==" | tee -a probe-results.txt
          # price-band searches: >= ¥15M (hyper) and ¥8-15M (luxury)
          f "$BASE/php/search/summary.php?b_to_b_price_min=15000000&search_type=price_search" probe-l-sum15m.html
          f "$BASE/php/search/summary.php?b_to_b_price_min=8000000&b_to_b_price_max=15000000&search_type=price_search" probe-l-sum8to15.html
          # model landings for luxury staples
          f "$BASE/usedcars/NISSAN/GT_R/" probe-l-gtr.html
          f "$BASE/usedcars/LEXUS/LC/" probe-l-lexus-lc.html
          f "$BASE/usedcars/PORSCHE/911/" probe-l-911.html
          f "$BASE/usedcars/MERCEDES_BENZ/S_CLASS/" probe-l-sclass.html
          f "$BASE/usedcars/BMW/7_SERIES/" probe-l-7series.html
          f "$BASE/usedcars/TOYOTA/CENTURY/" probe-l-century.html
          f "$BASE/usedcars/LEXUS/LX/" probe-l-lexus-lx.html
          f "$BASE/usedcars/TOYOTA/LAND_CRUISER_300/" probe-l-lc300.html
          # make landings (no cards, but they list the model slugs + counts)
          f "$BASE/usedcars/FERRARI/" probe-l-ferrari.html
          f "$BASE/usedcars/LAMBORGHINI/" probe-l-lambo.html
          f "$BASE/usedcars/ROLLS_ROYCE/" probe-l-rolls.html
          f "$BASE/usedcars/BENTLEY/" probe-l-bentley.html
          f "$BASE/usedcars/MCLAREN/" probe-l-mclaren.html
          f "$BASE/usedcars/ASTON_MARTIN/" probe-l-aston.html
          f "$BASE/usedcars/MASERATI/" probe-l-maserati.html
          for x in probe-l-*.html; do
            echo "$x: $(wc -c <"$x")B $(grep -o '[0-9]\{21\}' "$x" | sort -u | wc -l) ids" | tee -a probe-results.txt
          done
      - name: commit results
        run: |
          git config user.name 'relay-probe'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m "relay-probe: results $(date -u +%FT%TZ)" || echo nothing-to-commit
          git push
