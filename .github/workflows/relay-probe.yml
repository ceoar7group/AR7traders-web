# Relay probe: GitHub runners can reach the photo CDN while the sandbox
# cannot. Round S1 (2026-11-06): download the 18 showroom galleries, build
# one labelled contact sheet per car (to spot dealer promo frames) and save
# each cover photo as the source for the AR7-branded showroom heroes.
# The payload is restored to the main version before the PR is merged.
name: relay-probe
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/relay-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/f6184ee1-ar7traders-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: download galleries and build contact sheets
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          node --input-type=module > /tmp/dl.txt <<'EOF'
          import { readFileSync } from 'fs';
          const seed = JSON.parse(readFileSync('src/site-content.seed.json', 'utf8'));
          for (const car of seed.listings.filter(x => Number(x.id) <= 18)) {
            (car.images || []).forEach((u, i) => console.log(car.id + ' ' + i + ' ' + u));
          }
          EOF
          wc -l /tmp/dl.txt
          mkdir -p /tmp/cars
          while read -r id idx url; do
            mkdir -p "/tmp/cars/$id"
            printf '%s\n' "curl -sS -m 40 -A '$UA' -o /tmp/cars/$id/$(printf %02d "$idx").jpg '$url' || true"
          done < /tmp/dl.txt > /tmp/jobs.sh
          xargs -d '\n' -P 8 -I CMD bash -c CMD < /tmp/jobs.sh || true
          mkdir -p probe-shots/thumbs
          for d in /tmp/cars/*; do
            id=$(basename "$d")
            pid=$(printf %02d "$id")
            [ -f "$d/00.jpg" ] && cp "$d/00.jpg" "probe-shots/cover-$pid.jpg"
          done
          npm install --no-save sharp > /dev/null 2>&1
          node --input-type=module <<'EOF2'
          import { readdirSync, mkdirSync } from 'fs';
          import sharp from 'sharp';
          mkdirSync('probe-shots/thumbs', { recursive: true });
          const base = '/tmp/cars';
          for (const id of readdirSync(base)) {
            const pid = String(id).padStart(2, '0');
            for (const f of readdirSync(base + '/' + id)) {
              try {
                await sharp(base + '/' + id + '/' + f).resize({ width: 220 }).jpeg({ quality: 62 }).toFile('probe-shots/thumbs/' + pid + '-' + f);
              } catch { /* skip broken download */ }
            }
          }
          EOF2
          du -sh probe-shots
      - name: commit results
        run: |
          git config user.name 'relay-probe'
          git config user.email 'actions@github.com'
          git add probe-shots
          git commit -m "relay-probe: showroom contact sheets" || echo nothing
          git push
