# A diagnostic probe, dispatched by hand, that measures what this repo's
# scraper can only guess at from inside Vercel: what goo-net and the Jina
# relay ACTUALLY answer, from a network we can read the logs of. Each probe
# prints status / size / seconds, the first bytes of the body, and how many
# /usedcar/spread/ links (real car cards) the answer carries.
#
# 2026-11-05 mission: (a) discover the exchange's keyword / make-model search
# URL format for the on-demand scraper, (b) capture premium price-band pages
# to source real cars that replace the demo showroom supercars.
name: relay-probe
on:
  workflow_dispatch: {}
  # workflow_dispatch only registers once the file reaches the default
  # branch; the push trigger lets the probe run from a working branch too.
  push:
    paths:
      - '.github/workflows/relay-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe the exchange search formats and premium stock
        run: |
          exec > >(tee probe-results.txt) 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          BASE="https://www.goo-net-exchange.com"
          fetchx () { # url outfile
            curl -sS --compressed -L -m 30 -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -o "$2" -w 'answer: %{http_code} %{size_download}B %{time_total}s %{url_effective}\n' "$1"
          }
          cards () { # file — print the card ids and JPY prices this page carries
            grep -oE 'href="/usedcars/[A-Z0-9_]+/[A-Z0-9_]+/[0-9]+/"' "$1" | grep -oE '[0-9]{15,}' | sort -u > /tmp/ids.txt
            echo "cards: $(wc -l < /tmp/ids.txt)"
            echo "ids: $(head -c 600 /tmp/ids.txt | tr '\n' ' ')"
            echo "jpy prices: $(grep -oE 'class="price currency-jpy">\xc2\xa5[0-9,]+' "$1" | grep -oE '[0-9,]+$' | head -24 | tr '\n' ' ')"
          }
          echo "== the JS that drives the search form (param names live here) =="
          fetchx "$BASE/build/assets/ajax_search-BCE-JsqM.js" probe-x-ajax-search.js
          fetchx "$BASE/build/assets/summary-CBeYHeYA.js" probe-x-summary.js
          echo "== homepage (its search form markup) =="
          fetchx "$BASE/" probe-x-home.html
          echo "== free word candidates =="
          fetchx "$BASE/php/search/summary.php?free_word=alphard&search_type=free_word_search" probe-x-fw1.html
          cards probe-x-fw1.html
          fetchx "$BASE/php/search/summary.php?free_word=alphard" probe-x-fw2.html
          cards probe-x-fw2.html
          echo "== maker / model candidates =="
          fetchx "$BASE/php/search/summary.php?maker_cd=TOYOTA&search_type=maker_search" probe-x-mk1.html
          cards probe-x-mk1.html
          fetchx "$BASE/usedcars/TOYOTA/ALPHARD/" probe-x-model-landing.html
          cards probe-x-model-landing.html
          echo "== premium band 5M-30M JPY (showroom replacement stock) p1 =="
          fetchx "$BASE/php/search/summary.php?b_to_b_price_min=5000000&b_to_b_price_max=30000000&search_type=price_search" probe-x-prem1.html
          cards probe-x-prem1.html
          echo "== premium band p2 (offset=20) =="
          fetchx "$BASE/php/search/summary.php?b_to_b_price_min=5000000&b_to_b_price_max=30000000&search_type=price_search&offset=20" probe-x-prem2.html
          cards probe-x-prem2.html
          echo "== upper-mid band 3M-5M JPY p1 =="
          fetchx "$BASE/php/search/summary.php?b_to_b_price_min=3000000&b_to_b_price_max=5000000&search_type=price_search" probe-x-prem3.html
          cards probe-x-prem3.html
      # The sandbox driving this session cannot download Actions logs (they
      # live on a blob host outside its egress allowlist), so the results are
      # committed to the branch where a plain `git fetch` can read them.
      - name: Commit the results to the branch
        if: always()
        run: |
          git config user.name "relay-probe"
          git config user.email "relay-probe@users.noreply.github.com"
          git add probe-results.txt probe-x-*
          git commit -m "relay-probe: results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
