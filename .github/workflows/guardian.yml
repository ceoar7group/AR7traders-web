# Site guardian — the checks in scripts/guardian.mjs, run where the repository
# is: on a serverless function there is no repo and no build to inspect.
#
# On failure the workflow fails, so a broken link, a missing security header or
# a shipped secret turns the run red instead of waiting to be noticed.
#
# The report is committed back (public/guardian-report.json) so the CRM's Site
# guardian panel always shows the most recent real run. That commit only ever
# touches that one file.
name: Site guardian

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'      # nightly, 03:17 UTC
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    # Bounded: this job installs, builds, audits and runs the whole test suite.
    # Without a timeout a hung step holds a runner for six hours (the default)
    # and the nightly report simply never appears.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (the guardian audits the built site)
        run: npm run build
      - name: Guardian checks
        run: npm run guard
      - name: SEO audit
        run: npm run seo
      - name: Test suite
        run: npm test
      # Nightly data retention: trims only exhaust tables (old audit rows,
      # automation logs, AI usage counters, cancelled drafts) on conservative
      # windows so the free Supabase tier stays healthy forever. Business
      # records are never touched — see scripts/db-retention.mjs. Skips
      # itself silently when the two secrets are not configured.
      # Nightly IndexNow ping: resubmits every sitemap URL to the IndexNow
      # endpoint (Bing, Yandex, Seznam, Naver re-crawl on it; the key file
      # public/9a97f235….txt is already deployed, so the submission verifies).
      # Google ignores IndexNow but reads the same sitemap on its own schedule.
      # Never fails the nightly run — a refused ping is a log line, not an
      # outage.
      - name: IndexNow ping (search engines re-crawl changed pages)
        env:
          AR7_INDEXNOW_KEY: 9a97f235e19210f1ad6e1f642980aa91
        run: node scripts/seo-agent.mjs indexnow --all
        continue-on-error: true
      - name: Data retention (Supabase free tier)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/db-retention.mjs
        continue-on-error: true
      - name: Commit the report
        if: always()
        run: |
          if [ -n "$(git status --porcelain public/guardian-report.json)" ]; then
            git config user.name  "ar7-guardian"
            git config user.email "guardian@ar7traders.com"
            git add public/guardian-report.json
            git commit -m "chore(guardian): nightly report $(date -u +%Y-%m-%d)"
            git push
          else
            echo "report unchanged"
          fi
